<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>massdns · DNS at scale</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body>
  <div class="bg"></div>
  <main>
    <header>
      <h1><span class="bolt">⚡</span> massdns</h1>
      <p class="tag">High-performance DNS stub resolver, served over HTTP.</p>
    </header>

    <section class="panel">
      <div class="row">
        <label class="field grow">
          <span class="lbl">Domains <em>(one per line, max {{ max_domains }})</em></span>
          <textarea id="domains" spellcheck="false" placeholder="example.com&#10;cloudflare.com&#10;github.com"></textarea>
        </label>
      </div>

      <div class="row controls">
        <label class="field">
          <span class="lbl">Record type</span>
          <select id="type">
            {% for t in allowed_types %}
              <option value="{{ t }}"{% if t == 'A' %} selected{% endif %}>{{ t }}</option>
            {% endfor %}
          </select>
        </label>

        <div class="actions">
          <button id="run" class="primary">Resolve</button>
          <button id="stop" class="ghost" disabled>Stop</button>
          <button id="clear" class="ghost">Clear</button>
        </div>

        <div class="stats" id="stats">
          <span class="pill" id="status-pill">idle</span>
          <span class="metric"><b id="count">0</b> responses</span>
          <span class="metric"><b id="elapsed">0.0s</b></span>
        </div>
      </div>
    </section>

    <section class="results">
      <div class="results-head">
        <h2>Results</h2>
        <div class="view-toggle">
          <button data-view="pretty" class="active">Pretty</button>
          <button data-view="raw">Raw ndjson</button>
        </div>
      </div>
      <div id="pretty" class="view active"></div>
      <pre id="raw" class="view"></pre>
    </section>

    <footer>
      <code>POST /resolve</code> — JSON or text/plain. <a href="/api">API info</a> · <a href="/healthz">/healthz</a>
    </footer>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
