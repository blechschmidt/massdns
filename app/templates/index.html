<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ＭＡＳＳＤＮＳ · vaporwave dns</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Orbitron:wght@500;700;900&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body>
  <div class="bg-sky"></div>
  <div class="bg-stars"></div>
  <div class="bg-grid"></div>
  <div class="bg-scanlines"></div>

  <main>
    <header>
      <div class="brand">
        <img class="logo" src="{{ url_for('static', filename='logo.svg') }}" alt="" />
        <div class="title">
          <h1 data-text="ＭＡＳＳＤＮＳ">ＭＡＳＳＤＮＳ</h1>
          <p class="tag">▒░ a e s t h e t i c   ░ ▒   d n s   ░  ▒  ░  resolver</p>
        </div>
      </div>
      <p class="subtag">▶ stream millions of records into the sunset.</p>
    </header>

    <section class="panel">
      <div class="row">
        <label class="field grow">
          <span class="lbl">◢ DOMAINS <em>// one per line · max {{ max_domains }}</em></span>
          <textarea id="domains" spellcheck="false" placeholder="example.com&#10;cloudflare.com&#10;github.com"></textarea>
        </label>
      </div>

      <div class="row controls">
        <label class="field">
          <span class="lbl">◢ RECORD</span>
          <select id="type">
            {% for t in allowed_types %}
              <option value="{{ t }}"{% if t == 'A' %} selected{% endif %}>{{ t }}</option>
            {% endfor %}
          </select>
        </label>

        <div class="actions">
          <button id="run" class="primary">▶ R E S O L V E</button>
          <button id="stop" class="ghost" disabled>■ STOP</button>
          <button id="clear" class="ghost">✕ CLEAR</button>
        </div>

        <div class="stats" id="stats">
          <span class="pill" id="status-pill">idle</span>
          <span class="metric"><b id="count">0</b> hits</span>
          <span class="metric"><b id="elapsed">0.0s</b></span>
        </div>
      </div>
    </section>

    <section class="results">
      <div class="results-head">
        <h2>◤ T R A N S M I S S I O N</h2>
        <div class="view-toggle">
          <button data-view="pretty" class="active">pretty</button>
          <button data-view="raw">ndjson</button>
        </div>
      </div>
      <div id="pretty" class="view active"></div>
      <pre id="raw" class="view"></pre>
    </section>

    <footer>
      <code>POST /resolve</code> · <a href="/api">/api</a> · <a href="/healthz">/healthz</a>
      <div class="copy">▼ ｂｕｉｌｔ ｗｉｔｈ massdns + flask, served from the cloud horizon ▼</div>
    </footer>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
